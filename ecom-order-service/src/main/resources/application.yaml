spring:
  application:
    name: ecom-order-service

logging:
  level:
    com.example.ecom_order_service.client: DEBUG

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    registry-refresh-interval-seconds: 30
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    lease-renewal-interval-seconds: 30