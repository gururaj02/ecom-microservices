spring:
  application:
    name: ecom-inventory-service

  datasource:
    url: jdbc:h2:mem:inventorydb
    username: admin
    password: password
  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8082

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/